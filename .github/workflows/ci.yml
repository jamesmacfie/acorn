name: Lint and test

# The Linux suite gates every run. The unsigned macOS desktop suite runs on pull requests and main
# pushes. Installers and Node archives are built only for `v*` tags and manual dispatches, through
# build-desktop.yml and build-node.yml, and only after the Linux suite passes for the same commit. Only
# a tag's installers are signed for the updater, by sign-desktop, after they're built.
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

# A second push to the same branch makes the first run's answer worthless. The event is in the group
# so a main push does not cancel a manual installer build of main. Tag builds are never cancelled.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # Lint and the test shards are separate jobs so they run side by side. Each restores and saves its own
  # slice of Turborepo's cache.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          # The major from node-runtime.json. node:sqlite sets the floor, so an older major does not
          # boot the service at all.
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Turborepo's local cache, carried between runs: restored from the newest entry for this job, saved
      # under this commit. turbo.json decides what a hit may skip, so a task that reads files it does not
      # declare must be fixed there, not here.
      - name: Restore Turborepo task results
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-lint-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-lint-

      # oxlint, the oxfmt check, the knip unused-export check, then `tsc --noEmit` in every package. Four
      # parts in one script: an earlier failure means tsc never ran, so read which part went red before
      # trusting the types.
      - run: pnpm lint

      # Saved even when a task fails, because Turborepo stores only the tasks that passed. Saving only
      # green runs left a red streak on main restoring a weeks-old cache that matched nothing.
      - name: Prune old Turborepo results
        if: ${{ !cancelled() }}
        run: find .turbo/cache -type f -mtime +7 -delete 2>/dev/null || true
      - name: Save Turborepo task results
        if: ${{ !cancelled() }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-lint-${{ github.sha }}

  test:
    # Linux, not macOS, for the two things the suite needs that a macOS runner does not have: Docker,
    # which the container probes look for, and a /var that is not a symlink to /private/var, which one
    # http test compares paths against (docs/testing/ci.md § Historical failures).
    runs-on: ubuntu-latest
    strategy:
      # Every shard reports, so one red package does not hide another.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      # The slowest suites, split by their times in a cold run. Shard 3 runs every package named in
      # neither list, so a new package is tested without editing them.
      SHARD_1: '@acorn/plugin-agents @acorn/node-core @acorn/plugin-workflows @acorn/plugin-github'
      SHARD_2: '@acorn/client-core @acorn/tui @acorn/node @acorn/plugin-editor'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Restore Turborepo task results
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-test-${{ matrix.shard }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-test-${{ matrix.shard }}-

      # `pnpm test`, not `turbo run test`: the root script rebuilds node-pty for this ABI first and
      # bounds Turborepo's concurrency, and without the bound the suites that spawn processes or mint
      # certificates time out under the load while passing in isolation (AGENTS.md).
      #
      # The desktop suite needs macOS and Rust, so the separate job below runs it. The site's suite runs
      # in site.yml, against both of its builds.
      - name: Test shard ${{ matrix.shard }}
        env:
          SHARD: ${{ matrix.shard }}
          # Exercise both sides of the TUI's 80-cell layout breakpoint. turbo.json declares it as an
          # input of the TUI suite, so the two widths do not share a cache entry.
          ACORN_TUI_WIDE: '1'
          # The runner has four cores, and each package's Vitest already starts a worker per core. Six
          # packages at once timed out tests that finish in under a second locally, and two still
          # broke the timing-sensitive diff layout tests in a four-core Linux container.
          ACORN_TEST_CONCURRENCY: '1'
        run: |
          case "$SHARD" in
            1) filters=$(printf -- '--filter=%s ' $SHARD_1) ;;
            2) filters=$(printf -- '--filter=%s ' $SHARD_2) ;;
            *) filters=$(printf -- '--filter=!%s ' $SHARD_1 $SHARD_2 @acorn/desktop @acorn/site) ;;
          esac
          pnpm test $filters

      - name: Prune old Turborepo results
        if: ${{ !cancelled() }}
        run: find .turbo/cache -type f -mtime +7 -delete 2>/dev/null || true
      - name: Save Turborepo task results
        if: ${{ !cancelled() }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-test-${{ matrix.shard }}-${{ github.sha }}

  desktop:
    # A packaging run tests the desktop inside build-desktop.yml, against the bytes it bundles.
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/'))
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Cache the pinned Node runtime
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/acorn/node-runtime
          key: node-runtime-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('node-runtime.json') }}

      # This script stages the bundle inputs, builds the renderer, runs Vitest (including the
      # helper boot test), and runs the Rust unit tests. It does not sign or publish an artifact.
      - name: Test the desktop
        run: pnpm --filter @acorn/desktop test

  # Installers wait for the Linux suite, so a red commit never spends the installer runners' minutes.
  package:
    needs: [lint, test]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/build-desktop.yml
    secrets:
      ACORN_SENTRY_DSN: ${{ secrets.ACORN_SENTRY_DSN }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

  # Signs a tag's updater payloads after package built them. The key is a secret of the release
  # environment, whose rules admit only `v*` tags, so a manual build of a branch never holds it. A job
  # hands every secret it names to its runner, where any step could read it, so this job runs no
  # repository code. It checks out two JSON files and signs with a pinned Tauri CLI.
  sign-desktop:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    environment: release
    steps:
      # Data only: the version each signature names, and the public key installed apps trust.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          sparse-checkout: |
            apps/desktop/package.json
            apps/desktop/src-tauri/tauri.conf.json
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: acorn-{dmg,windows-*,linux-*}
          path: bundles
      - name: Sign the updater payloads
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          npm_config_ignore_scripts: 'true'
        # Keep the CLI version equal to @tauri-apps/cli in pnpm-lock.yaml. The architecture tests check it.
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo "::error::Set TAURI_SIGNING_PRIVATE_KEY as a secret of the release environment. Generate a keypair with \`pnpm --filter @acorn/desktop exec tauri signer generate\` and put its public half in apps/desktop/src-tauri/tauri.conf.json."; exit 1; }
          version=$(jq -er .version apps/desktop/package.json)
          payloads=(bundles/**/*.app.tar.gz bundles/**/*-setup.exe bundles/**/*.AppImage)
          test ${#payloads[@]} -gt 0 || { echo "::error::The package job uploaded no updater payloads."; exit 1; }
          for payload in "${payloads[@]}"; do
            npx --yes @tauri-apps/cli@2.12.3 signer sign --app-version "$version" "$payload" </dev/null
          done
      # Fails the release unless every signature verifies against the key the app has built in.
      - name: Check the signatures against the built-in public key
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          sudo apt-get update
          sudo apt-get install -y minisign
          jq -er .plugins.updater.pubkey apps/desktop/src-tauri/tauri.conf.json | base64 -d > "$RUNNER_TEMP/updater.pub"
          for payload in bundles/**/*.app.tar.gz bundles/**/*-setup.exe bundles/**/*.AppImage; do
            base64 -d < "$payload.sig" > "$RUNNER_TEMP/payload.minisig"
            minisign -V -p "$RUNNER_TEMP/updater.pub" -m "$payload" -x "$RUNNER_TEMP/payload.minisig"
          done
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: acorn-updater-signatures
          path: bundles/**/*.sig
          if-no-files-found: error
          retention-days: 1

  # Gate 1 of docs/shell.md § Signing gates and the updater. A tag builds, signs, and keeps its
  # artifacts through the jobs above; publishing them as a release is refused while the build is
  # ad-hoc signed, because a public download that Gatekeeper blocks and an updater payload nobody can
  # install are worse than no release at all. Turning this on is: buy a Developer ID, add the
  # certificate and notarization secrets, sign and notarize inside the same `tauri build` pass, then
  # replace this step with the publish.
  publish-desktop:
    needs: sign-desktop
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Refuse to publish an ad-hoc signed build
        # Through the environment, never interpolated into the script: a tag name is attacker-supplied
        # text as far as this shell is concerned.
        env:
          TAG: ${{ github.ref_name }}
        run: |
          echo "::error::$TAG built successfully and its artifacts are attached to this run, but publishing is gated on Apple Developer ID signing and notarization (docs/shell.md § Signing gates and the updater)."
          exit 1

  # The Node-only archives and container image, on the installers' triggers and behind the same gate.
  package-node:
    needs: [lint, test]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    # On a tag, the image job pushes to the GitHub container registry, and the release job attaches the
    # archives to the tag's GitHub release. Both sign provenance attestations with the run's OIDC token.
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/build-node.yml
