name: Build the desktop app

# The desktop artifact. There are no GitHub OAuth secrets here on purpose: the client id is a
# node-side plugin read now, from the environment or the data root's .env file.
#
# Called by ci.yml for `v*` tags and manual dispatches, after the Linux suite passes for the same
# commit. Ordinary pushes get the unsigned desktop suite there instead of an installer.
#
# The signing secrets are optional here so a missing key reaches the check step below, which says how
# to create one, rather than failing the call with a bare "secret required" error. The Sentry ones are
# optional because a fork has neither, and builds without them.
on:
  workflow_call:
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false
      ACORN_SENTRY_DSN:
        required: false
      SENTRY_AUTH_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: acorn-dmg
            artifacts: |
              apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
              apps/desktop/src-tauri/target/release/bundle/macos/*.app.tar.gz
              apps/desktop/src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
          - os: windows-latest
            artifact: acorn-windows-x64
            artifacts: |
              apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
              apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe.sig
          # Arm64 is what Parallels runs on an Apple silicon Mac, and Linux has no built-in x64 emulation.
          - os: ubuntu-24.04
            artifact: acorn-linux-x64
            artifacts: &appimage |
              apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
              apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage.sig
          - os: ubuntu-24.04-arm
            artifact: acorn-linux-arm64
            artifacts: *appimage
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    # Hidden source maps for the Sentry upload below: a `v*` tag with the token and both variables set.
    # A fork, a manual run, or a repository without them builds no maps and skips the upload. This is
    # a yes or no, never the token, which only the upload step sees.
    env:
      ACORN_RELEASE_SOURCEMAPS: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.SENTRY_AUTH_TOKEN != '' && vars.SENTRY_ORG != '' && vars.SENTRY_PROJECT != '' && '1' || '' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Require the updater signing key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo "::error::Set the TAURI_SIGNING_PRIVATE_KEY repo secret. Generate a keypair with \`pnpm --filter @acorn/desktop exec tauri signer generate\` and put its public half in apps/desktop/src-tauri/tauri.conf.json."; exit 1; }

      # WebKitGTK and the libraries Tauri links on Linux (tauri.app/start/prerequisites). libdbus is
      # for the keychain's Secret Service backend.
      - name: Install the Linux build libraries
        if: runner.os == 'Linux'
        # xdg-utils gives the bundler xdg-mime, which the arm64 runner image doesn't include.
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev file xdg-utils

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          # Whatever runs the build, not what gets bundled: the staging script downloads the pinned
          # runtime from nodejs.org and verifies it against that release's SHASUMS256.txt.
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: apps/desktop/src-tauri

      # One download per pin per runner image, which is worth a cache entry of its own because the
      # rust-cache key has nothing to do with it.
      - name: Cache the pinned Node runtime
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/acorn/node-runtime
          key: node-runtime-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('node-runtime.json') }}

      # The node service, the bundled plugins, the helper, the bridge, the migration chains and the
      # pinned runtime, then the renderer and its startup budget checks. Built once: the Sentry step
      # below adds debug ids when it runs, then the tests run against this output and the bundler
      # packages it unchanged.
      - name: Build the bundle inputs
        # The acorn team's DSN, written into the sentry-telemetry bundle for a `v*` tag only, so a
        # manual run from a branch reports nowhere. It can only send, and it's a secret so it stays
        # out of logs and forks. A fork, or a run without it, builds with none.
        env:
          ACORN_SENTRY_RELEASE_DSN: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.ACORN_SENTRY_DSN || '' }}
        run: pnpm --filter @acorn/desktop run build

      # Gives every staged file a debug id, uploads the maps for this release and platform, then
      # deletes them. The exporter names the same release and dist, and calls a packaged Node file by
      # the name it's uploaded under (docs/integrations/sentry/the-acorn-teams-dsn.md § Readable
      # stacks). The token can write releases across the organization, so it's in this step's
      # environment and no other. The bundle check fails if any map is left behind.
      - name: Upload source maps to Sentry
        if: env.ACORN_RELEASE_SOURCEMAPS == '1'
        working-directory: apps/desktop/dist
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: |
          set -euo pipefail
          sentry() { npx --yes @sentry/cli@3.8.2 "$@"; }
          release="acorn@$(node -p 'require("../package.json").version')"
          dist="$(node -p 'process.platform + "-" + process.arch')"
          sentry sourcemaps inject --ignore node_modules helper client bundled-plugins
          sentry sourcemaps upload --release "$release" --dist "$dist" --ignore node_modules --url-prefix 'app:///helper' helper
          sentry sourcemaps upload --release "$release" --dist "$dist" --url-prefix 'app:///plugins' bundled-plugins
          sentry sourcemaps upload --release "$release" --dist "$dist" --url-prefix '~' client
          find helper client bundled-plugins -name '*.map' -delete

      - name: Test plugin database preparation
        run: pnpm --filter @acorn/node-core test src/server/plugins/pluginDbFiles.test.ts

      # The shell's own boot test plus the Rust unit tests. This is the gate that catches "the shell
      # cannot load its world" (docs/testing/desktop.md § The desktop boot test), and it runs before the
      # slow bundler pass so a broken boot path fails in seconds rather than minutes.
      - name: Test the shell and the helper
        run: pnpm --filter @acorn/desktop run test:built

      - name: Build and verify the bundle
        # The public half is baked into tauri.conf.json; updater artifacts require this key.
        # dist also runs repository build commands, so this entire step must be trusted.
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Linux only: stops the AppImage tool stripping the binaries it packs. It still rewrites
          # their library search path, so the verify step checks Node by version, not by digest.
          NO_STRIP: 'true'
        run: pnpm --filter @acorn/desktop run dist --prebuilt

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
          # The repository caps retention at one day. Saying so here keeps a later change to that
          # setting from quietly restoring the 90-day default for every installer.
          retention-days: 1

  # Gate 1 of docs/shell.md § Signing gates and the updater. A tag builds and keeps its
  # artifacts through the job above; publishing them as a release is refused while the build is
  # ad-hoc signed, because a public download that Gatekeeper blocks and an updater payload nobody can
  # install are worse than no release at all. Turning this on is: buy a Developer ID, add the
  # certificate and notarization secrets, sign and notarize inside the same `tauri build` pass, then
  # replace this step with the publish.
  publish:
    needs: bundle
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Refuse to publish an ad-hoc signed build
        # Through the environment, never interpolated into the script: a tag name is attacker-supplied
        # text as far as this shell is concerned.
        env:
          TAG: ${{ github.ref_name }}
        run: |
          echo "::error::$TAG built successfully and its artifacts are attached to this run, but publishing is gated on Apple Developer ID signing and notarization (docs/shell.md § Signing gates and the updater)."
          exit 1
