[[permission]]
identifier = "renderer-commands"
description = "Allows the Acorn renderer to call the desktop shell commands."
commands.allow = [
  "helper_endpoint",
  "pick_folder",
  "pick_files",
  "save_file",
  "open_external_url",
  "take_pending_links",
  "reveal_data_folder",
  "open_config_file",
  "force_quit",
  "quit_approved",
  "show_notification",
  "set_badge",
  "set_window_background",
  "cli_install_status",
  "cli_install",
  "reset_export",
  "reset_complete",
  "webview_diagnostics",
  "webview_trial_delay",
  "overlay_debug_focus",
  "overlay_begin",
  "overlay_update",
  "webview_ensure",
  "webview_bounds",
  "webview_show",
  "webview_hide",
  "webview_load",
  "webview_command",
  "webview_evict",
  "webview_evict_previews",
]
