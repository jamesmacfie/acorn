[package]
name = "acorn-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "The acorn desktop shell"
publish = false

[lib]
# Tauri's own layout: the app is a library so the mobile targets and the integration tests can both
# reach it, and main.rs is four lines that call into it.
name = "acorn_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# The preview pane's devtools item, and the only thing it gates. Tauri exposes `open_devtools` in a
# debug build for free; a release build has to ask, and a shipped release deliberately does not
# (src/webviews.rs).
devtools = ["tauri/devtools"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `unstable` is what exposes `Window::add_child`, the child-webview API the preview pane and plugin
# webview surfaces are built on (src/webviews.rs). Phase 0 measured it before the design committed.
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
# The file dialogs base64 their bytes across the Tauri channel (src/commands.rs).
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
getrandom = "0.2"
hex = "0.4"
# Dev only in practice: the app scheme proxies to the Vite dev server so the renderer keeps its own
# origin while it keeps HMR (src/app_scheme.rs).
ureq = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
