# macOS-only packaging (docs/electron.md §4i). Run via `pnpm dist`.
appId: io.acorn.app
productName: acorn
directories:
  output: release
  buildResources: build
# Ship the built main/preload, the renderer, and package.json (electron needs "main").
files:
  - out/**
  - dist/client/**
  - package.json
# Native modules can't live inside the asar — unpack them so the .node loads at runtime.
# ripgrep ships a platform-native `rg` binary the search pane execs — same rule (see main/search.ts).
asarUnpack:
  - "**/*.node"
  - node_modules/better-sqlite3/**
  # @vscode/ripgrep resolves rg from a sibling platform package as of v1.18.
  - node_modules/@vscode/ripgrep*/**
# Drizzle migrations are read at runtime; ship them as resources so process.resourcesPath/migrations
# resolves (see migrationsFolder in src/core/main/bindings.ts).
extraResources:
  # `out/migrations`, NOT packages/node-core/migrations directly. Phase 2 split the database into core
  # plus one file per plugin, and electron.vite.config.ts's stageMigrations already assembles every
  # chain there: core's at the root, each plugin's under out/migrations/<plugin>. Shipping only
  # node-core's chain meant main/pluginMigrations.ts found no <resources>/migrations/<plugin>, fell back
  # to its ancestor walk, and migrated the PLUGIN database with CORE's 40 migrations — `out/` lands
  # inside app.asar, so the staged copy was never reachable as a resource. Caught by an adversarial
  # review simulating the walk from out/main/service.js.
  - from: out/migrations
    to: migrations
# Never auto-publish from CI; the workflow uploads the dmg as an artifact instead.
publish: null
mac:
  category: public.app-category.developer-tools
  target:
    - dmg
    - zip
  # Personal use: ad-hoc signing. Add a Developer ID identity + notarization only to distribute.
  identity: null
