<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The ASCII acorn reduced to its cap and its outline, in the default Light and Dark themes' text color. -->
  <style>
    .cap { fill: #242424; }
    .outline { fill: none; stroke: #242424; stroke-width: 2.5; stroke-linejoin: round; }
    @media (prefers-color-scheme: dark) {
      .cap { fill: #dddddd; }
      .outline { stroke: #dddddd; }
    }
  </style>
  <path class="cap" d="M14.5 2h3v4h-3zM3 15C3 9.5 8.5 6 16 6s13 3.5 13 9z" />
  <path class="outline" d="M6.5 15v4.5L16 29.5l9.5-10V15" />
</svg>
