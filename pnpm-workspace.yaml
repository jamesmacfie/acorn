packages:
  - "apps/*"
  - "packages/*"
overrides:
  "@hono/node-server": ">=2.0.11"
  dompurify: ">=3.4.12"
  fast-uri: ">=3.1.4"
allowBuilds:
  better-sqlite3: true
  electron: true
  electron-winstaller: false # Windows-only; this build is macOS-only
  esbuild: true
  node-pty: true
  sharp: true
  workerd: true
onlyBuiltDependencies:
  - better-sqlite3
  - electron
  - esbuild
  - node-pty
  - sharp
  - workerd
