apiVersion: acorn.dev/contribution-fixtures/v2

contributions:
  - &common
    id: fleet
    type: fleet-source
    artifact: views
    capabilityVersion: "2.0"
    label: Fleet source
    description: Complete fleet source fixture.
    order: 10
    when: null
    requires: &requires
      dependencies: []
      grants: []
      rendererCapabilities: []
      rendererNodes: []
    fallback: &fallback
      kind: unsupported
      desktop: placeholder
      mobile: semantic
      reason: Required capability is unavailable.
    definition: { kind: fleet-source, icon: grid, route: fleet, view: fleet }

  - <<: *common
    id: workspace
    type: workspace-source
    label: Workspace source
    description: Complete workspace source fixture.
    definition: { kind: workspace-source, icon: folder, route: workspace, view: workspace }

  - <<: *common
    id: pane
    type: task-pane
    label: Task pane
    description: Complete task pane fixture.
    definition: { kind: task-pane, icon: panel, view: pane, dataQuery: "dev.acme.pane.snapshot.v1", minimumWidth: 280, retention: session }

  - <<: *common
    id: route
    type: route
    label: Route
    description: Complete route fixture.
    definition: { kind: route, pathTemplate: "/tasks/:taskId", view: pane, scope: task }

  - <<: *common
    id: command
    type: command
    label: Command
    description: Complete command fixture.
    definition:
      kind: command
      title: Run action
      category: Example
      target: dev.acme.example.action.run.v1
      inputAcquisition: active-resource
      resourceScope: task
      repeatable: false
      confirmation: risk

  - <<: *common
    id: keybinding
    type: keybinding
    label: Keybinding
    description: Complete keybinding fixture.
    definition: { kind: keybinding, command: command, scope: task, defaultChord: "Cmd+Shift+E" }

  - <<: *common
    id: menu
    type: context-menu
    label: Context menu
    description: Complete context menu fixture.
    definition:
      kind: context-menu
      command: command
      menu: task.file
      group: example.actions
      selectionTypes: [file]

  - <<: *common
    id: shell
    type: shell-slot
    label: Shell slot
    description: Complete shell slot fixture.
    definition:
      kind: shell-slot
      slot: topbar.right
      view: shell
      modality: non-modal
      dismissal: user
      focusReturn: invoker

  - <<: *common
    id: task-slot
    type: task-slot
    label: Task slot
    description: Complete task slot fixture.
    definition:
      kind: task-slot
      slot: task.footer
      view: task-status
      modality: none
      dismissal: host
      focusReturn: pane

  - <<: *common
    id: settings
    type: settings-page
    label: Settings
    description: Complete settings page fixture.
    definition:
      kind: settings-page
      scope: workspace
      schema: &schema
        uri: urn:acorn-plugin:acme:example:schema:settings-v1
        digest: sha256:1111111111111111111111111111111111111111111111111111111111111111
      view: settings

  - <<: *common
    id: wizard
    type: wizard
    label: Setup
    description: Complete wizard fixture.
    definition: { kind: wizard, wizardId: setup }

  - <<: *common
    id: notice
    type: notice-kind
    label: Notice kind
    description: Complete notice kind fixture.
    definition: { kind: notice-kind, severity: warning, icon: alert, toastPolicy: foreground }

  - <<: *common
    id: notification
    type: notification
    label: Notification
    description: Complete notification fixture.
    definition:
      kind: notification
      event: dev.acme.example.alert.raised.v1
      severity: warning
      renderer: acorn.content/2
      deduplicationField: data.alertId
      privacy: internal
      expirationSeconds: 3600
      toastPolicy: foreground
      targetIntent: alert-open
      actions: [command]

  - <<: *common
    id: attention
    type: attention-item
    label: Attention
    description: Complete attention item fixture.
    definition:
      kind: attention-item
      snapshotQuery: dev.acme.example.attention.list.v1
      events: [dev.acme.example.alert.raised.v1]
      actions: [command]

  - <<: *common
    id: badge
    type: badge
    label: Badge
    description: Complete badge fixture.
    definition:
      kind: badge
      anchor: task.rail
      valueBinding: data.count
      toneMap: { active: success, failed: danger }
      textAlternative: Example status count
      aggregation: sum
      displayCap: 99
      staleBehavior: mark-stale

  - <<: *common
    id: poller
    type: poller
    label: Poller
    description: Complete scheduled worker fixture.
    definition:
      kind: poller
      worker:
        apiVersion: acorn.dev/worker/v2
        id: refresh
        mode: scheduled
        operation: dev.acme.example.refresh.run.v1
        minimumIntervalMs: 30000
        jitterMs: 3000
        timeoutMs: 10000
        overlap: coalesce
        visibility: connected-client
        missedTick: run-once
        startup: wait-first-interval
        backoff: &backoff
          initialMs: 1000
          maximumMs: 60000
          multiplier: 2
          jitterPercent: 20
          maxConsecutiveFailures: 5
        checkpoint: &checkpoint
          enabled: true
          maximumBytes: 65536
          schema: *schema
        resources: &resources
          memoryMiB: 64
          cpuMillisPerMinute: 5000
          handles: 32
          outputBytesPerMinute: 1048576

  - <<: *common
    id: subscription
    type: subscription
    label: Subscription
    description: Complete event-driven worker fixture.
    definition:
      kind: subscription
      worker:
        apiVersion: acorn.dev/worker/v2
        id: event-reactor
        mode: event-driven
        operation: dev.acme.example.events.consume.v1
        events: [acorn.core.task.updated.v2]
        batchSize: 50
        batchWindowMs: 250
        timeoutMs: 10000
        overlap: serial
        gapRecovery: snapshot
        backoff: *backoff
        checkpoint: *checkpoint
        resources: *resources

  - <<: *common
    id: background
    type: background-worker
    label: Background worker
    description: Complete resident worker fixture.
    definition:
      kind: background-worker
      worker:
        apiVersion: acorn.dev/worker/v2
        id: resident
        mode: resident
        operation: dev.acme.example.service.run.v1
        startup: installation-active
        readinessTimeoutMs: 10000
        heartbeatIntervalMs: 5000
        heartbeatTimeoutMs: 15000
        drainTimeoutMs: 30000
        restart: on-failure
        backoff: *backoff
        checkpoint: *checkpoint
        resources: *resources

  - <<: *common
    id: query
    type: query
    label: Query
    description: Complete query fixture.
    definition:
      kind: query
      operation: dev.acme.example.items.list.v1
      inputSchema: *schema
      outputSchema: *schema

  - <<: *common
    id: action
    type: action
    label: Action
    description: Complete action fixture.
    definition:
      kind: action
      operation: dev.acme.example.action.run.v1
      inputSchema: *schema
      outputSchema: *schema

  - <<: *common
    id: context
    type: context-section
    label: Context section
    description: Complete context section fixture.
    definition:
      kind: context-section
      snapshotQuery: dev.acme.example.context.get.v1
      maximumBytes: 65536
      maximumTokens: 16384
      sensitivity: sensitive

  - <<: *common
    id: tool-renderer
    type: agent-tool-renderer
    label: Agent tool renderer
    description: Complete agent tool renderer fixture.
    definition:
      kind: agent-tool-renderer
      toolSchema: *schema
      view: tool-result
      genericFallback: true

  - <<: *common
    id: navigation
    type: navigation-intent
    label: Navigation intent
    description: Complete navigation intent fixture.
    definition:
      kind: navigation-intent
      patterns:
        - template: "https://example.test/items/{itemId:slug}"
          queryPolicy: { mode: reject, allowedKeys: [], captures: {} }
      destination:
        kind: resource
        resourceType: example.item
        captureMapping: { itemId: "$capture.itemId" }
      externalPolicy: internal-only
      collisionPolicy: reject-install

  - <<: *common
    id: client-presentation
    type: client-presentation
    label: Client presentation state
    description: Complete bounded client-local presentation fixture.
    definition:
      kind: client-presentation
      subscriptions: [workspace-focused, pane-focused]
      slices:
        - id: recent-focus
          sourceEvents: [workspace-focused, pane-focused]
          reducer: recent-distinct
          capacity: 20
          maximumBytes: 32768
          persistence: client-device
          privacy: client-local-only
          disableBehavior: freeze
          uninstallBehavior: clear
      automations:
        - id: follow-focus
          trigger: workspace-focused
          clientCommand: dev.acme.example.focus.follow.v1
          debounceMs: 250
          ownerApproval: installation
          inputMapping: { workspace: "$event.workspace" }

  - <<: *common
    id: promotion
    type: source-promotion
    label: Source promotion
    description: Complete source promotion fixture.
    definition:
      kind: source-promotion
      sourceType: example.item
      prepareCommand: dev.acme.example.promotion.prepare.v1
      createCommand: acorn.core.task.create.v2
      linkCommand: dev.acme.example.promotion.link.v1

  - <<: *common
    id: renderer
    type: renderer-provider
    label: Renderer provider
    description: Complete renderer provider fixture.
    definition:
      kind: renderer-provider
      renderer: acorn.code-editor/2
      implementation: acorn.client.example.editor
      minimumClientVersion: 2.0.0
      desktopBehavior: embedded
      features: [text, selection]
      accessibilityContract: *schema
      mobileFallback: read-only

  - <<: *common
    id: theme
    type: theme
    label: Theme
    description: Complete theme fixture.
    definition: { kind: theme, tokensPath: assets/theme.json }

  - <<: *common
    id: style
    type: style
    label: Style
    description: Complete style fixture.
    definition: { kind: style, tokensPath: assets/style.json }
