apiVersion: acorn.dev/plugin-manifest-fixtures/v2
purpose: >-
  Machine-valid primary contribution and artifact-class fixtures for every current Acorn plugin.
  These deliberately exercise one representative surface and are not release manifests; the
  release manifest must expand the complete normative operation, event, dependency, permission,
  settings, wizard and contribution catalogs before signing.

manifests:
  - &agents
    apiVersion: acorn.dev/plugin/v2
    coordinate: acorn/agents
    version: 2.0.0
    displayName: Agents
    description: System agent-session service and Agent Center contribution.
    license: Apache-2.0
    compatibility: &compatibility
      nodeProtocol: { min: "2.0", max: "2.0" }
      clientProtocol: { min: "2.0", max: "2.0" }
      rendererCapabilities: []
    artifacts: &systemArtifacts
      - id: node
        kind: runtime
        target: node
        runtime: system
        digest: sha256:1111111111111111111111111111111111111111111111111111111111111111
        size: 1024
        mediaType: application/octet-stream
        path: runtime/system.bin
        platform: any
        architecture: any
        entrypoint: runtime/system.bin
      - &viewsArtifact
        id: views
        kind: ui
        target: client
        runtime: declarative
        digest: sha256:2222222222222222222222222222222222222222222222222222222222222222
        size: 1024
        mediaType: application/vnd.acorn.declarative-ui+json
        path: ui/views.json
        platform: any
        architecture: any
        entrypoint: ui/views.json
    contributions:
      - id: agent-center
        type: fleet-source
        artifact: views
        capabilityVersion: "2.0"
        label: Agent Center
        description: Fleet-wide agent session and attention source.
        order: 20
        when: null
        requires: &emptyRequires
          dependencies: []
          grants: []
          rendererCapabilities: []
          rendererNodes: []
        fallback: &semanticFallback
          kind: unsupported
          desktop: placeholder
          mobile: semantic
          reason: The requested renderer is unavailable.
        definition:
          kind: fleet-source
          icon: bot
          route: agent-center
          view: agent-center
    bespokeViews: []
    operations: []
    streams: []
    capabilities: &emptyCapabilities { requested: [], exported: [] }
    dependencies: []
    events: &emptyEvents { publishes: [], subscribes: [] }
    settings: []
    wizards: []
    storage: &storage
      schemaVersion: 0
      quotaBytes: 0
      backup: exclude-all
      migrations: []
    health: &health
      startupTimeoutMs: 10000
      checkIntervalMs: 30000
      failureThreshold: 3
    provenance: &provenance
      publisherKeyId: acorn-release-2026
      manifestDigest: sha256:3333333333333333333333333333333333333333333333333333333333333333
      signature: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      sbomDigest: sha256:4444444444444444444444444444444444444444444444444444444444444444
      transparencyEntry: https://transparency.acorn.dev/fixtures/current

  - <<: *agents
    coordinate: acorn/github
    displayName: GitHub
    description: System GitHub mirror, pull-request review, and repository source.
    contributions:
      - id: repositories
        type: workspace-source
        artifact: views
        capabilityVersion: "2.0"
        label: GitHub
        description: Browse repositories and pull requests.
        order: 10
        when: null
        requires: *emptyRequires
        fallback: *semanticFallback
        definition: { kind: workspace-source, icon: github, route: repositories, view: repositories }

  - <<: *agents
    coordinate: acorn/terminal
    displayName: Terminal
    description: System terminal sessions, PTY streams, and drawer surface.
    contributions:
      - id: terminal-drawer
        type: shell-slot
        artifact: views
        capabilityVersion: "2.0"
        label: Terminal
        description: Task-scoped terminal drawer.
        order: 20
        when: null
        requires: *emptyRequires
        fallback: *semanticFallback
        definition:
          kind: shell-slot
          slot: task.drawer
          view: terminal
          modality: non-modal
          dismissal: user
          focusReturn: pane

  - &verifiedBase
    apiVersion: acorn.dev/plugin/v2
    coordinate: acorn/changes
    version: 2.0.0
    displayName: Changes
    description: Local changes and review-note contribution.
    license: Apache-2.0
    compatibility: *compatibility
    artifacts: &wasiArtifacts
      - id: node
        kind: runtime
        target: node
        runtime: wasi-component
        digest: sha256:5555555555555555555555555555555555555555555555555555555555555555
        size: 1024
        mediaType: application/wasm
        path: runtime/plugin.wasm
        platform: any
        architecture: any
        entrypoint: runtime/plugin.wasm
      - *viewsArtifact
    contributions:
      - &taskPane
        id: changes
        type: task-pane
        artifact: views
        capabilityVersion: "2.0"
        label: Changes
        description: Primary task pane.
        order: 20
        when: null
        requires: *emptyRequires
        fallback: *semanticFallback
        definition:
          kind: task-pane
          icon: git-compare
          view: changes
          minimumWidth: 280
          retention: session
    bespokeViews: []
    operations: []
    streams: []
    capabilities: *emptyCapabilities
    dependencies: []
    events: *emptyEvents
    settings: []
    wizards: []
    storage: *storage
    health: *health
    provenance: *provenance

  - <<: *verifiedBase
    coordinate: acorn/context
    displayName: Context
    description: Typed context-section aggregation and immutable snapshot creation.
    contributions:
      - id: task-context
        type: context-section
        artifact: node
        capabilityVersion: "2.0"
        label: Task context
        description: Bounded task context section.
        order: 40
        when: null
        requires: *emptyRequires
        fallback: *semanticFallback
        definition:
          kind: context-section
          snapshotQuery: dev.acorn.context.inventory.get.v1
          maximumBytes: 262144
          maximumTokens: 65536
          sensitivity: sensitive

  - <<: *verifiedBase
    coordinate: acorn/database
    displayName: Database
    description: Task database browser, query editor, and saved-query owner.
    contributions:
      - <<: *taskPane
        id: database
        label: Database
        description: Browse and edit the task database.
        order: 70
        definition: { kind: task-pane, icon: table, view: database, minimumWidth: 360, retention: session }

  - <<: *verifiedBase
    coordinate: acorn/docker
    displayName: Docker
    description: Docker inventory, actions, task matching, and stream owner.
    contributions:
      - id: docker-status
        type: badge
        artifact: views
        capabilityVersion: "2.0"
        label: Docker status
        description: Count matching task containers.
        order: 75
        when: null
        requires: *emptyRequires
        fallback: *semanticFallback
        definition:
          kind: badge
          anchor: task.rail
          valueBinding: data.runningCount
          toneMap: { running: success, stopped: neutral, failed: danger }
          textAlternative: Docker container status
          aggregation: sum
          displayCap: 99
          staleBehavior: mark-stale

  - <<: *verifiedBase
    coordinate: acorn/editor
    displayName: Editor
    description: Standard editor, file, search, and diff renderer provider.
    contributions:
      - id: code-editor-provider
        type: renderer-provider
        artifact: views
        capabilityVersion: "2.0"
        label: Code editor
        description: Electron implementation of the standard code editor.
        order: 10
        when: null
        requires: *emptyRequires
        fallback: *semanticFallback
        definition:
          kind: renderer-provider
          renderer: acorn.code-editor/2
          implementation: acorn.client.editor.monaco
          minimumClientVersion: 2.0.0
          desktopBehavior: embedded
          features: [text, selection, diagnostics]
          accessibilityContract:
            uri: urn:acorn:renderer:code-editor:a11y:v2
            digest: sha256:6666666666666666666666666666666666666666666666666666666666666666
          mobileFallback: read-only

  - <<: *verifiedBase
    coordinate: acorn/http
    displayName: HTTP
    description: Saved requests, variables, brokered send, and response viewer.
    contributions:
      - <<: *taskPane
        id: http
        label: API requests
        description: Compose and send task-scoped requests.
        order: 80
        definition: { kind: task-pane, icon: globe, view: http, minimumWidth: 360, retention: session }

  - <<: *verifiedBase
    coordinate: acorn/memory
    displayName: Memory
    description: Human-gated memory entries, proposals, search, and context export.
    contributions:
      - id: memory-context
        type: context-section
        artifact: node
        capabilityVersion: "2.0"
        label: Memory
        description: Bounded memory index for task context.
        order: 50
        when: null
        requires: *emptyRequires
        fallback: *semanticFallback
        definition:
          kind: context-section
          snapshotQuery: dev.acorn.memory.context-section.get.v1
          maximumBytes: 32768
          maximumTokens: 8192
          sensitivity: sensitive

  - <<: *verifiedBase
    coordinate: acorn/notes
    displayName: Notes
    description: Scoped note storage, editor, import, export, and context contribution.
    contributions:
      - <<: *taskPane
        id: notes
        label: Notes
        description: Task, workspace, and global note editor.
        order: 30
        definition: { kind: task-pane, icon: notebook, view: notes, minimumWidth: 320, retention: session }

  - <<: *verifiedBase
    coordinate: acorn/onboarding
    displayName: Onboarding
    description: First-run invariant and default-profile setup wizard.
    artifacts: [*viewsArtifact]
    contributions:
      - id: first-run
        type: wizard
        artifact: views
        capabilityVersion: "2.0"
        label: Set up Acorn
        description: Resumable first-run setup.
        order: 0
        when: null
        requires: *emptyRequires
        fallback: *semanticFallback
        definition: { kind: wizard, wizardId: first-run }

  - <<: *verifiedBase
    coordinate: acorn/preview
    displayName: Preview
    description: Node target resolution and selected Electron browser host.
    contributions:
      - <<: *taskPane
        id: preview
        label: Preview
        description: Task browser preview.
        order: 65
        definition: { kind: task-pane, icon: browser, view: preview, minimumWidth: 360, retention: session }

  - <<: *verifiedBase
    coordinate: acorn/workflows
    displayName: Workflows
    description: Durable workflow definitions, runs, gates, triggers, and activity.
    contributions:
      - <<: *taskPane
        id: workflow-activity
        label: Workflows
        description: Workflow run and gate activity.
        order: 45
        definition: { kind: task-pane, icon: workflow, view: workflow-activity, minimumWidth: 320, retention: session }

  - <<: *verifiedBase
    coordinate: acorn/linear
    displayName: Linear
    description: Verified Linear source and external-reference integration.
    contributions:
      - id: linear
        type: workspace-source
        artifact: views
        capabilityVersion: "2.0"
        label: Linear
        description: Browse configured Linear projects and issues.
        order: 90
        when: null
        requires: *emptyRequires
        fallback: *semanticFallback
        definition: { kind: workspace-source, icon: circle, route: linear, view: linear }

  - <<: *verifiedBase
    coordinate: acorn/rollbar
    displayName: Rollbar
    description: Verified privacy-normalized Rollbar item integration.
    contributions:
      - id: rollbar
        type: workspace-source
        artifact: views
        capabilityVersion: "2.0"
        label: Rollbar
        description: Browse normalized Rollbar items.
        order: 95
        when: null
        requires: *emptyRequires
        fallback: *semanticFallback
        definition: { kind: workspace-source, icon: circle-alert, route: rollbar, view: rollbar }

  - <<: *verifiedBase
    coordinate: acorn/model-providers
    displayName: Model Providers
    description: Verified brokered model-provider connections and generation capability.
    contributions:
      - id: model-provider-settings
        type: settings-page
        artifact: views
        capabilityVersion: "2.0"
        label: Model providers
        description: Configure brokered model provider connections.
        order: 55
        when: null
        requires: *emptyRequires
        fallback: *semanticFallback
        definition:
          kind: settings-page
          scope: node
          schema:
            uri: urn:acorn:model-providers:settings:v1
            digest: sha256:7777777777777777777777777777777777777777777777777777777777777777
          view: model-provider-settings

  - <<: *verifiedBase
    coordinate: acorn/profile-aider
    displayName: Aider profile
    description: Verified executable profile descriptor and interactive launch adapter.
    artifacts: [*viewsArtifact]
    contributions:
      - &profileCommand
        id: launch-aider
        type: command
        artifact: views
        capabilityVersion: "2.0"
        label: Launch Aider
        description: Launch the verified Aider profile in the active task.
        order: 100
        when: null
        requires: *emptyRequires
        fallback: *semanticFallback
        definition:
          kind: command
          title: Launch Aider
          category: Agents
          target: dev.acorn.profile-aider.session.launch.v1
          inputAcquisition: active-resource
          resourceScope: task
          repeatable: false
          confirmation: native-execution
    operations:
      - id: dev.acorn.profile-aider.session.launch.v1
        descriptor:
          uri: urn:acorn:profile-aider:operation:session-launch-v1
          digest: sha256:8181818181818181818181818181818181818181818181818181818181818181

  - <<: *verifiedBase
    coordinate: acorn/profile-claude
    displayName: Claude profile
    description: Verified Claude executable profile and normalized stream adapter.
    artifacts: [*viewsArtifact]
    contributions:
      - <<: *profileCommand
        id: launch-claude
        label: Launch Claude
        description: Launch the verified Claude profile in the active task.
        definition:
          kind: command
          title: Launch Claude
          category: Agents
          target: dev.acorn.profile-claude.session.launch.v1
          inputAcquisition: active-resource
          resourceScope: task
          repeatable: false
          confirmation: native-execution
    operations:
      - id: dev.acorn.profile-claude.session.launch.v1
        descriptor:
          uri: urn:acorn:profile-claude:operation:session-launch-v1
          digest: sha256:8282828282828282828282828282828282828282828282828282828282828282

  - <<: *verifiedBase
    coordinate: acorn/profile-codex
    displayName: Codex profile
    description: Verified Codex executable profile and normalized app-server adapter.
    artifacts: [*viewsArtifact]
    contributions:
      - <<: *profileCommand
        id: launch-codex
        label: Launch Codex
        description: Launch the verified Codex profile in the active task.
        definition:
          kind: command
          title: Launch Codex
          category: Agents
          target: dev.acorn.profile-codex.session.launch.v1
          inputAcquisition: active-resource
          resourceScope: task
          repeatable: false
          confirmation: native-execution
    operations:
      - id: dev.acorn.profile-codex.session.launch.v1
        descriptor:
          uri: urn:acorn:profile-codex:operation:session-launch-v1
          digest: sha256:8383838383838383838383838383838383838383838383838383838383838383
