openapi: 3.1.0
info:
  title: Acorn Node V2 API
  version: 2.0.0
  description: Normative HTTPS API for a local or remote Acorn Node.
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
  - url: https://{nodeHost}:{nodePort}
    variables:
      nodeHost:
        default: acorn.example.test
      nodePort:
        default: "4317"
security:
  - mutualTLS: []
tags:
  - name: Pairing
  - name: Session
  - name: Query
  - name: Command
  - name: Snapshot
  - name: Object
paths:
  /v2/pairing/claim:
    post:
      operationId: claimPairingSession
      tags: [Pairing]
      summary: Claim a one-time pairing session after verifying the Node fingerprint.
      security: []
      requestBody:
        required: true
        content:
          application/vnd.acorn.v2+json:
            schema:
              $ref: "#/components/schemas/PairingClaim"
      responses:
        "201":
          description: Full-owner device certificate issued.
          headers:
            X-Acorn-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/vnd.acorn.v2+json:
              schema:
                $ref: "#/components/schemas/PairingResult"
        "400":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
  /v2/devices/{deviceId}/credential-rotations:
    post:
      operationId: prepareDeviceCredentialRotation
      tags: [Session]
      summary: Prepare a pending new device credential while the old credential remains active.
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { $ref: "#/components/schemas/UuidV7" }
      requestBody:
        required: true
        content:
          application/vnd.acorn.v2+json:
            schema: { $ref: "#/components/schemas/DeviceRotationPrepare" }
      responses:
        "201":
          description: Pending credential stored; it is valid only for the commit operation.
          headers:
            X-Acorn-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/vnd.acorn.v2+json:
              schema: { $ref: "#/components/schemas/DeviceRotationPrepared" }
        "401": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /v2/devices/{deviceId}/credential-rotations/{rotationId}/commit:
    post:
      operationId: commitDeviceCredentialRotation
      tags: [Session]
      summary: Atomically activate the stored new credential and revoke the prior serial.
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { $ref: "#/components/schemas/UuidV7" }
        - name: rotationId
          in: path
          required: true
          schema: { $ref: "#/components/schemas/UuidV7" }
      requestBody:
        required: true
        content:
          application/vnd.acorn.v2+json:
            schema: { $ref: "#/components/schemas/DeviceRotationCommit" }
      responses:
        "200":
          description: New generation is the sole active credential.
          headers:
            X-Acorn-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/vnd.acorn.v2+json:
              schema: { $ref: "#/components/schemas/DeviceRotationResult" }
        "401": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /v2/recovery/claim:
    post:
      operationId: claimSoleOwnerRecovery
      tags: [Pairing]
      summary: Claim an unexpired encrypted sole-owner recovery authority.
      security: []
      requestBody:
        required: true
        content:
          application/vnd.acorn.v2+json:
            schema: { $ref: "#/components/schemas/SoleOwnerRecoveryClaim" }
      responses:
        "201":
          description: Replacement full-owner device credential issued and recovery epoch advanced.
          headers:
            X-Acorn-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/vnd.acorn.v2+json:
              schema: { $ref: "#/components/schemas/SoleOwnerRecoveryResult" }
        "400": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
  /v2/node:
    get:
      operationId: getNodeDescriptor
      tags: [Session]
      summary: Read the authenticated Node descriptor.
      responses:
        "200":
          description: Current descriptor.
          headers:
            X-Acorn-Request-Id:
              $ref: "#/components/headers/RequestId"
            ETag:
              schema: { type: string, maxLength: 100 }
          content:
            application/vnd.acorn.v2+json:
              schema:
                $ref: ../schema/node-descriptor-v2.schema.json
        "401":
          $ref: "#/components/responses/Problem"
  /v2/session/handshake:
    post:
      operationId: createSessionHandshake
      tags: [Session]
      summary: Negotiate protocol, renderers and a one-use event-socket ticket.
      requestBody:
        required: true
        content:
          application/vnd.acorn.v2+json:
            schema:
              $ref: "#/components/schemas/HandshakeRequest"
      responses:
        "200":
          description: Negotiated session.
          headers:
            X-Acorn-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/vnd.acorn.v2+json:
              schema:
                $ref: "#/components/schemas/HandshakeResult"
        "401":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /v2/session/capabilities:
    put:
      operationId: updateSessionCapabilities
      tags: [Session]
      summary: Replace client renderer capabilities and advance the session revision.
      requestBody:
        required: true
        content:
          application/vnd.acorn.v2+json:
            schema:
              $ref: "#/components/schemas/CapabilityUpdate"
      responses:
        "200":
          description: Updated negotiated session revision.
          headers:
            X-Acorn-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/vnd.acorn.v2+json:
              schema:
                type: object
                additionalProperties: false
                required: [sessionRevision, acceptedCapabilities]
                properties:
                  sessionRevision:
                    $ref: "#/components/schemas/Decimal"
                  acceptedCapabilities:
                    type: array
                    maxItems: 512
                    items:
                      $ref: ../schema/capability-v2.schema.json#/$defs/rendererAdvertisement
        "409":
          $ref: "#/components/responses/Problem"
  /v2/queries/{queryId}:
    post:
      operationId: executeQuery
      tags: [Query]
      summary: Execute a declared side-effect-free query.
      parameters:
        - name: queryId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/NamespacedId"
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            minLength: 16
            maxLength: 4096
      requestBody:
        required: true
        content:
          application/vnd.acorn.v2+json:
            schema:
              type: object
              maxProperties: 128
      responses:
        "200":
          description: Query result validated by the registered query schema.
          headers:
            X-Acorn-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/vnd.acorn.v2+json:
              schema:
                $ref: "#/components/schemas/QueryResult"
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v2/commands:
    post:
      operationId: executeCommand
      tags: [Command]
      summary: Execute or durably accept an idempotent command.
      requestBody:
        required: true
        content:
          application/vnd.acorn.v2+json:
            schema:
              $ref: "#/components/schemas/Command"
      responses:
        "200":
          description: Committed, cancelled, failed or replayed durable terminal result.
          headers:
            X-Acorn-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/vnd.acorn.v2+json:
              schema:
                $ref: "#/components/schemas/CommandTerminalResult"
        "202":
          description: Durable asynchronous operation accepted.
          headers:
            X-Acorn-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/vnd.acorn.v2+json:
              schema:
                $ref: "#/components/schemas/CommandAccepted"
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /v2/commands/{commandId}:
    get:
      operationId: getCommandResult
      tags: [Command]
      summary: Read an accepted or terminal command result.
      parameters:
        - $ref: "#/components/parameters/CommandId"
      responses:
        "200":
          description: Current command result.
          headers:
            X-Acorn-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/vnd.acorn.v2+json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/CommandTerminalResult"
                  - $ref: "#/components/schemas/CommandAccepted"
        "404":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: cancelCommand
      tags: [Command]
      summary: Request cancellation using the original command identity.
      parameters:
        - $ref: "#/components/parameters/CommandId"
      responses:
        "200":
          description: Cancellation state.
          headers:
            X-Acorn-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/vnd.acorn.v2+json:
              schema:
                type: object
                additionalProperties: false
                required: [commandId, status]
                properties:
                  commandId:
                    $ref: "#/components/schemas/UuidV7"
                  status:
                    enum: [cancellation-requested, cancelled]
        "409":
          $ref: "#/components/responses/Problem"
  /v2/snapshots:
    post:
      operationId: createAuthorizedSnapshot
      tags: [Snapshot]
      summary: Obtain authorized snapshots for event-gap recovery.
      requestBody:
        required: true
        content:
          application/vnd.acorn.v2+json:
            schema:
              type: object
              additionalProperties: false
              required: [resourceTypes]
              properties:
                resourceTypes:
                  type: array
                  minItems: 1
                  maxItems: 64
                  uniqueItems: true
                  items:
                    type: string
                    pattern: "^[a-z][a-z0-9.-]*$"
                roots:
                  type: array
                  maxItems: 64
                  uniqueItems: true
                  items:
                    $ref: "#/components/schemas/AcornUri"
      responses:
        "200":
          description: Snapshot at one core event boundary.
          headers:
            X-Acorn-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/vnd.acorn.v2+json:
              schema:
                $ref: ../schema/snapshot-v2.schema.json
        "403":
          $ref: "#/components/responses/Problem"
  /v2/objects:
    post:
      operationId: beginObjectUpload
      tags: [Object]
      summary: Create a quarantined content-addressed upload.
      requestBody:
        required: true
        content:
          application/vnd.acorn.v2+json:
            schema:
              $ref: "#/components/schemas/ObjectUploadRequest"
      responses:
        "201":
          description: Fifteen-minute upload grant.
          headers:
            X-Acorn-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/vnd.acorn.v2+json:
              schema:
                $ref: "#/components/schemas/ObjectUploadGrant"
  /v2/objects/{objectId}:
    get:
      operationId: downloadObject
      tags: [Object]
      summary: Download an authorized immutable object.
      parameters:
        - $ref: "#/components/parameters/ObjectId"
        - name: Range
          in: header
          required: false
          schema:
            type: string
            pattern: "^bytes=[0-9]+-[0-9]*$"
      responses:
        "200":
          description: Complete object.
          headers:
            X-Acorn-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "206":
          description: Requested byte range.
          headers:
            X-Acorn-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "404":
          $ref: "#/components/responses/Problem"
    put:
      operationId: uploadObjectChunk
      tags: [Object]
      summary: Upload one bounded object range.
      parameters:
        - $ref: "#/components/parameters/ObjectId"
        - name: Content-Range
          in: header
          required: true
          schema:
            type: string
            pattern: "^bytes [0-9]+-[0-9]+/[0-9]+$"
        - name: Digest
          in: header
          required: true
          schema:
            type: string
            pattern: "^sha-256=[A-Za-z0-9+/]{43}=$"
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary, maxLength: 8388608 }
      responses:
        "204":
          description: Chunk verified and stored.
          headers:
            X-Acorn-Request-Id:
              $ref: "#/components/headers/RequestId"
        "409":
          $ref: "#/components/responses/Problem"
components:
  securitySchemes:
    mutualTLS:
      type: mutualTLS
      description: Node-issued full-owner client device certificate over TLS 1.3.
  headers:
    RequestId:
      required: true
      schema:
        $ref: "#/components/schemas/UuidV7"
  parameters:
    CommandId:
      name: commandId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UuidV7"
    ObjectId:
      name: objectId
      in: path
      required: true
      schema:
        type: string
        pattern: "^sha256:[0-9a-f]{64}$"
  responses:
    Problem:
      description: Stable V2 problem detail.
      headers:
        X-Acorn-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: ../schema/error-envelope-v2.schema.json
  schemas:
    UuidV7:
      type: string
      pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
    Decimal:
      type: string
      pattern: "^(0|[1-9][0-9]*)$"
    Timestamp:
      type: string
      format: date-time
      pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\\.[0-9]{3}Z$"
    AcornUri:
      type: string
      pattern: "^acorn://[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}/[a-z][a-z0-9.-]*/[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
    NamespacedId:
      type: string
      pattern: "^[a-z][a-z0-9-]*(?:[.-][a-z0-9-]+)+\\.v[1-9][0-9]*$"
      maxLength: 200
    ProtocolRange:
      type: object
      additionalProperties: false
      required: [min, max]
      properties:
        min: { type: string, pattern: "^[1-9][0-9]*\\.[0-9]+$" }
        max: { type: string, pattern: "^[1-9][0-9]*\\.[0-9]+$" }
    PairingClaim:
      type: object
      additionalProperties: false
      required:
        [apiVersion, pairingSessionId, pairingCode, expectedNodeId,
         expectedNodeIdentitySubjectPublicKeyInfo, expectedIdentityFingerprint, normalizedEndpoint,
         selectedProtocolMajor, ownerConfirmationId, challenge, deviceId, deviceLabel, platform,
         certificateRequest, certificateRequestDigest, clientNonce, transcriptDigest,
         clientKeyProof, pairingSecretProof]
      properties:
        apiVersion: { const: acorn.dev/pairing-claim/v2 }
        pairingSessionId: { $ref: "#/components/schemas/UuidV7" }
        pairingCode: { type: string, pattern: "^[a-z2-7]{26}$" }
        expectedNodeId: { $ref: "#/components/schemas/UuidV7" }
        expectedNodeIdentitySubjectPublicKeyInfo:
          type: string
          pattern: "^MCowBQYDK2VwAyE[A-Za-z0-9_-]{44}$"
          minLength: 59
          maxLength: 59
        expectedIdentityFingerprint: { type: string, pattern: "^acorn2:[a-z2-7]{52}$" }
        normalizedEndpoint:
          type: string
          format: uri
          pattern: "^https://(?:[a-z0-9](?:[a-z0-9.-]*[a-z0-9])?|\\[[0-9a-f:]+\\]):[1-9][0-9]{0,4}/$"
          maxLength: 500
        selectedProtocolMajor: { const: 2 }
        ownerConfirmationId: { $ref: "#/components/schemas/UuidV7" }
        challenge: { type: string, pattern: "^[A-Za-z0-9_-]{43}$" }
        deviceId: { $ref: "#/components/schemas/UuidV7" }
        deviceLabel: { type: string, minLength: 1, maxLength: 80 }
        platform: { enum: [darwin, linux, windows, ios, android, web] }
        certificateRequest: { type: string, minLength: 100, maxLength: 8192 }
        certificateRequestDigest: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
        clientNonce: { type: string, pattern: "^[A-Za-z0-9_-]{43}$" }
        transcriptDigest: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
        clientKeyProof: { type: string, pattern: "^[A-Za-z0-9_-]{86}$" }
        pairingSecretProof: { type: string, pattern: "^[A-Za-z0-9_-]{43}$" }
    PairingResult:
      type: object
      additionalProperties: false
      required:
        [apiVersion, pairingSessionId, transcriptDigest, nodeId, identityFingerprint, deviceId,
         credentialGeneration, certificateChain, expiresAt]
      properties:
        apiVersion: { const: acorn.dev/pairing-result/v2 }
        pairingSessionId: { $ref: "#/components/schemas/UuidV7" }
        transcriptDigest: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
        nodeId: { $ref: "#/components/schemas/UuidV7" }
        identityFingerprint: { type: string, pattern: "^acorn2:[a-z2-7]{52}$" }
        deviceId: { $ref: "#/components/schemas/UuidV7" }
        credentialGeneration: { const: "1" }
        certificateChain:
          type: array
          minItems: 2
          maxItems: 4
          items: { type: string, minLength: 100, maxLength: 8192 }
        expiresAt: { $ref: "#/components/schemas/Timestamp" }
    DeviceRotationPrepare:
      type: object
      additionalProperties: false
      required:
        [apiVersion, rotationId, nodeId, deviceId, currentGeneration, nextGeneration,
         certificateRequest, certificateRequestDigest, clientNonce, expiresAt,
         oldKeyProof, newKeyProof]
      properties:
        apiVersion: { const: acorn.dev/device-rotation-prepare/v2 }
        rotationId: { $ref: "#/components/schemas/UuidV7" }
        nodeId: { $ref: "#/components/schemas/UuidV7" }
        deviceId: { $ref: "#/components/schemas/UuidV7" }
        currentGeneration: { $ref: "#/components/schemas/Decimal" }
        nextGeneration: { $ref: "#/components/schemas/Decimal" }
        certificateRequest: { type: string, minLength: 100, maxLength: 8192 }
        certificateRequestDigest: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
        clientNonce: { type: string, pattern: "^[A-Za-z0-9_-]{43}$" }
        expiresAt: { $ref: "#/components/schemas/Timestamp" }
        oldKeyProof: { type: string, pattern: "^[A-Za-z0-9_-]{86}$" }
        newKeyProof: { type: string, pattern: "^[A-Za-z0-9_-]{86}$" }
    DeviceRotationPrepared:
      type: object
      additionalProperties: false
      required:
        [apiVersion, rotationId, deviceId, pendingGeneration, pendingCertificateChain,
         commitChallenge, expiresAt]
      properties:
        apiVersion: { const: acorn.dev/device-rotation-prepared/v2 }
        rotationId: { $ref: "#/components/schemas/UuidV7" }
        deviceId: { $ref: "#/components/schemas/UuidV7" }
        pendingGeneration: { $ref: "#/components/schemas/Decimal" }
        pendingCertificateChain:
          type: array
          minItems: 2
          maxItems: 4
          items: { type: string, minLength: 100, maxLength: 8192 }
        commitChallenge: { type: string, pattern: "^[A-Za-z0-9_-]{43}$" }
        expiresAt: { $ref: "#/components/schemas/Timestamp" }
    DeviceRotationCommit:
      type: object
      additionalProperties: false
      required:
        [apiVersion, rotationId, deviceId, pendingGeneration, commitChallenge, oldKeyProof,
         newKeyProof]
      properties:
        apiVersion: { const: acorn.dev/device-rotation-commit/v2 }
        rotationId: { $ref: "#/components/schemas/UuidV7" }
        deviceId: { $ref: "#/components/schemas/UuidV7" }
        pendingGeneration: { $ref: "#/components/schemas/Decimal" }
        commitChallenge: { type: string, pattern: "^[A-Za-z0-9_-]{43}$" }
        oldKeyProof: { type: string, pattern: "^[A-Za-z0-9_-]{86}$" }
        newKeyProof: { type: string, pattern: "^[A-Za-z0-9_-]{86}$" }
    DeviceRotationResult:
      type: object
      additionalProperties: false
      required:
        [apiVersion, rotationId, deviceId, activeGeneration, revokedSerial, activeSerial,
         committedAt]
      properties:
        apiVersion: { const: acorn.dev/device-rotation-result/v2 }
        rotationId: { $ref: "#/components/schemas/UuidV7" }
        deviceId: { $ref: "#/components/schemas/UuidV7" }
        activeGeneration: { $ref: "#/components/schemas/Decimal" }
        revokedSerial: { type: string, minLength: 1, maxLength: 160 }
        activeSerial: { type: string, minLength: 1, maxLength: 160 }
        committedAt: { $ref: "#/components/schemas/Timestamp" }
    SoleOwnerRecoveryClaim:
      type: object
      additionalProperties: false
      required:
        [apiVersion, recoveryId, nodeId, identityFingerprint, recoveryEpoch, deviceId,
         deviceLabel, platform, certificateRequest, certificateRequestDigest, clientNonce,
         expiresAt, recoverySecretProof, clientKeyProof]
      properties:
        apiVersion: { const: acorn.dev/sole-owner-recovery-claim/v2 }
        recoveryId: { $ref: "#/components/schemas/UuidV7" }
        nodeId: { $ref: "#/components/schemas/UuidV7" }
        identityFingerprint: { type: string, pattern: "^acorn2:[a-z2-7]{52}$" }
        recoveryEpoch: { $ref: "#/components/schemas/Decimal" }
        deviceId: { $ref: "#/components/schemas/UuidV7" }
        deviceLabel: { type: string, minLength: 1, maxLength: 80 }
        platform: { enum: [darwin, linux, windows, ios, android] }
        certificateRequest: { type: string, minLength: 100, maxLength: 8192 }
        certificateRequestDigest: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
        clientNonce: { type: string, pattern: "^[A-Za-z0-9_-]{43}$" }
        expiresAt: { $ref: "#/components/schemas/Timestamp" }
        recoverySecretProof: { type: string, pattern: "^[A-Za-z0-9_-]{43}$" }
        clientKeyProof: { type: string, pattern: "^[A-Za-z0-9_-]{86}$" }
    SoleOwnerRecoveryResult:
      type: object
      additionalProperties: false
      required:
        [apiVersion, recoveryId, nodeId, deviceId, credentialGeneration, recoveryEpoch,
         certificateChain, expiresAt]
      properties:
        apiVersion: { const: acorn.dev/sole-owner-recovery-result/v2 }
        recoveryId: { $ref: "#/components/schemas/UuidV7" }
        nodeId: { $ref: "#/components/schemas/UuidV7" }
        deviceId: { $ref: "#/components/schemas/UuidV7" }
        credentialGeneration: { const: "1" }
        recoveryEpoch: { $ref: "#/components/schemas/Decimal" }
        certificateChain:
          type: array
          minItems: 2
          maxItems: 4
          items: { type: string, minLength: 100, maxLength: 8192 }
        expiresAt: { $ref: "#/components/schemas/Timestamp" }
    HandshakeRequest:
      type: object
      additionalProperties: false
      required:
        [apiVersion, clientVersion, platform, architecture, http, events, rendererCapabilities,
         uiArtifacts, encodings, cursors]
      properties:
        apiVersion: { const: acorn.dev/handshake/v2 }
        clientVersion: { type: string, pattern: "^(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$" }
        platform: { enum: [darwin, linux, windows, ios, android, web] }
        architecture: { enum: [arm64, x86_64, other] }
        http: { $ref: "#/components/schemas/ProtocolRange" }
        events: { $ref: "#/components/schemas/ProtocolRange" }
        rendererCapabilities:
          type: array
          maxItems: 512
          items: { $ref: ../schema/capability-v2.schema.json#/$defs/rendererAdvertisement }
        uiArtifacts:
          type: array
          maxItems: 512
          items:
            type: object
            additionalProperties: false
            required: [coordinate, version, digest]
            properties:
              coordinate: { type: string, pattern: "^[a-z][a-z0-9-]{1,62}/[a-z][a-z0-9-]{1,62}$" }
              version: { type: string, pattern: "^(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$" }
              digest: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
        encodings:
          type: array
          minItems: 1
          maxItems: 8
          uniqueItems: true
          items: { enum: [identity, gzip, zstd, base64url] }
        cursors:
          type: object
          maxProperties: 128
          additionalProperties: { $ref: "#/components/schemas/Decimal" }
    HandshakeResult:
      type: object
      additionalProperties: false
      required:
        [apiVersion, sessionId, sessionRevision, selectedHttp, selectedEvents, selectedEncoding,
         node, nodeTime, maxClockSkewMs, eventSocketTicket, eventSocketTicketExpiresAt]
      properties:
        apiVersion: { const: acorn.dev/handshake-result/v2 }
        sessionId: { $ref: "#/components/schemas/UuidV7" }
        sessionRevision: { $ref: "#/components/schemas/Decimal" }
        selectedHttp: { type: string, pattern: "^2\\.[0-9]+$" }
        selectedEvents: { type: string, pattern: "^2\\.[0-9]+$" }
        selectedEncoding: { enum: [identity, gzip, zstd, base64url] }
        node: { $ref: ../schema/node-descriptor-v2.schema.json }
        nodeTime: { $ref: "#/components/schemas/Timestamp" }
        maxClockSkewMs: { const: 300000 }
        eventSocketTicket: { type: string, pattern: "^[A-Za-z0-9_-]{43,512}$" }
        eventSocketTicketExpiresAt: { $ref: "#/components/schemas/Timestamp" }
    CapabilityUpdate:
      type: object
      additionalProperties: false
      required: [expectedSessionRevision, rendererCapabilities, uiArtifacts]
      properties:
        expectedSessionRevision: { $ref: "#/components/schemas/Decimal" }
        rendererCapabilities:
          type: array
          maxItems: 512
          items: { $ref: ../schema/capability-v2.schema.json#/$defs/rendererAdvertisement }
        uiArtifacts:
          type: array
          maxItems: 512
          items:
            type: object
            additionalProperties: false
            required: [coordinate, version, digest]
            properties:
              coordinate: { type: string, maxLength: 127 }
              version: { type: string, maxLength: 64 }
              digest: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
    QueryResult:
      type: object
      additionalProperties: false
      required: [apiVersion, observedAt, snapshotSequence, data, nextCursor]
      properties:
        apiVersion: { const: acorn.dev/query-result/v2 }
        observedAt: { $ref: "#/components/schemas/Timestamp" }
        snapshotSequence: { $ref: "#/components/schemas/Decimal" }
        data: true
        nextCursor: { type: [string, "null"], maxLength: 4096 }
    Command:
      type: object
      additionalProperties: false
      required: [apiVersion, commandId, command, target, expectedRevision, sessionRevision, deadline, input]
      properties:
        apiVersion: { const: acorn.dev/command/v2 }
        commandId: { $ref: "#/components/schemas/UuidV7" }
        command: { $ref: "#/components/schemas/NamespacedId" }
        target: { $ref: "#/components/schemas/AcornUri" }
        expectedRevision:
          oneOf:
            - { $ref: "#/components/schemas/Decimal" }
            - { type: "null" }
        sessionRevision: { $ref: "#/components/schemas/Decimal" }
        deadline: { $ref: "#/components/schemas/Timestamp" }
        input: { type: object, maxProperties: 128 }
    CommandTerminalResult:
      oneOf:
        - $ref: "#/components/schemas/CommandCommitted"
        - $ref: "#/components/schemas/CommandCancelled"
        - $ref: "#/components/schemas/CommandFailed"
      discriminator:
        propertyName: status
        mapping:
          committed: "#/components/schemas/CommandCommitted"
          cancelled: "#/components/schemas/CommandCancelled"
          failed: "#/components/schemas/CommandFailed"
    CommandCommitted:
      type: object
      additionalProperties: false
      required:
        [apiVersion, commandId, status, replayed, target, resourceRevision, eventSequence,
         committedAt, result]
      properties:
        apiVersion: { const: acorn.dev/command-result/v2 }
        commandId: { $ref: "#/components/schemas/UuidV7" }
        status: { const: committed }
        replayed: { type: boolean }
        target: { $ref: "#/components/schemas/AcornUri" }
        resourceRevision:
          oneOf:
            - { $ref: "#/components/schemas/Decimal" }
            - { type: "null" }
        eventSequence:
          oneOf:
            - { $ref: "#/components/schemas/Decimal" }
            - { type: "null" }
        committedAt:
          oneOf:
            - { $ref: "#/components/schemas/Timestamp" }
            - { type: "null" }
        result: true
    CommandCancelled:
      type: object
      additionalProperties: false
      required:
        [apiVersion, commandId, status, replayed, target, resourceRevision, eventSequence,
         cancelledAt, code, retryable, detail]
      properties:
        apiVersion: { const: acorn.dev/command-result/v2 }
        commandId: { $ref: "#/components/schemas/UuidV7" }
        status: { const: cancelled }
        replayed: { type: boolean }
        target: { $ref: "#/components/schemas/AcornUri" }
        resourceRevision:
          oneOf:
            - { $ref: "#/components/schemas/Decimal" }
            - { type: "null" }
        eventSequence:
          oneOf:
            - { $ref: "#/components/schemas/Decimal" }
            - { type: "null" }
        cancelledAt: { $ref: "#/components/schemas/Timestamp" }
        code: { const: cancelled }
        retryable: { const: false }
        detail: { type: string, minLength: 1, maxLength: 500 }
    CommandFailed:
      type: object
      additionalProperties: false
      required:
        [apiVersion, commandId, status, replayed, target, resourceRevision, eventSequence,
         failedAt, error]
      properties:
        apiVersion: { const: acorn.dev/command-result/v2 }
        commandId: { $ref: "#/components/schemas/UuidV7" }
        status: { const: failed }
        replayed: { type: boolean }
        target: { $ref: "#/components/schemas/AcornUri" }
        resourceRevision:
          oneOf:
            - { $ref: "#/components/schemas/Decimal" }
            - { type: "null" }
        eventSequence:
          oneOf:
            - { $ref: "#/components/schemas/Decimal" }
            - { type: "null" }
        failedAt: { $ref: "#/components/schemas/Timestamp" }
        error:
          $ref: "#/components/schemas/CommandFailure"
    CommandFailure:
      type: object
      additionalProperties: false
      required: [type, title, code, retryable, detail, resource, currentRevision, retryAfterMs, errors]
      properties:
        type: { type: string, format: uri, pattern: "^https://acorn\\.dev/problems/v2/" }
        title: { type: string, minLength: 1, maxLength: 120 }
        code: { type: string, pattern: "^[a-z][a-z0-9_]{1,99}$" }
        retryable: { type: boolean }
        detail: { type: string, minLength: 1, maxLength: 500 }
        resource:
          oneOf:
            - { type: "null" }
            - { $ref: "#/components/schemas/AcornUri" }
        currentRevision:
          oneOf:
            - { type: "null" }
            - { $ref: "#/components/schemas/Decimal" }
        retryAfterMs: { type: [integer, "null"], minimum: 0, maximum: 3600000 }
        errors:
          type: array
          maxItems: 64
          items:
            type: object
            additionalProperties: false
            required: [path, code, message]
            properties:
              path: { type: string, pattern: "^(?:/[A-Za-z0-9_~-]+)*$", maxLength: 500 }
              code: { type: string, pattern: "^[a-z][a-z0-9_]{1,99}$" }
              message: { type: string, minLength: 1, maxLength: 300 }
    CommandAccepted:
      type: object
      additionalProperties: false
      required: [apiVersion, commandId, status, operation, resourceRevision, acceptedAt]
      properties:
        apiVersion: { const: acorn.dev/command-result/v2 }
        commandId: { $ref: "#/components/schemas/UuidV7" }
        status: { const: accepted }
        operation: { $ref: "#/components/schemas/AcornUri" }
        resourceRevision: { $ref: "#/components/schemas/Decimal" }
        acceptedAt: { $ref: "#/components/schemas/Timestamp" }
    ObjectUploadRequest:
      type: object
      additionalProperties: false
      required: [objectId, length, mediaType, purpose, target]
      properties:
        objectId: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
        length: { type: integer, minimum: 1, maximum: 2147483648 }
        mediaType: { type: string, minLength: 1, maxLength: 160 }
        purpose: { type: string, minLength: 1, maxLength: 100 }
        target: { $ref: "#/components/schemas/AcornUri" }
        filename: { type: string, maxLength: 255 }
    ObjectUploadGrant:
      type: object
      additionalProperties: false
      required: [objectId, uploadId, expiresAt, maxChunkBytes]
      properties:
        objectId: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
        uploadId: { $ref: "#/components/schemas/UuidV7" }
        expiresAt: { $ref: "#/components/schemas/Timestamp" }
        maxChunkBytes: { const: 8388608 }
