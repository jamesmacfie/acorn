asyncapi: 3.0.0
info:
  title: Acorn Node V2 event and stream socket
  version: 2.0.0
  description: One authenticated multiplexed WebSocket per Client and Node.
servers:
  node:
    host: "{nodeHost}:{nodePort}"
    protocol: wss
    pathname: /v2/events
    security:
      - $ref: "#/components/securitySchemes/deviceMtls"
    variables:
      nodeHost:
        default: acorn.example.test
      nodePort:
        default: "4317"
channels:
  nodeSocket:
    address: /v2/events
    messages:
      clientFrame:
        oneOf:
          - $ref: "#/components/messages/Subscribe"
          - $ref: "#/components/messages/Unsubscribe"
          - $ref: "#/components/messages/Acknowledge"
          - $ref: "#/components/messages/StreamOpen"
          - $ref: "#/components/messages/StreamCredit"
          - $ref: "#/components/messages/StreamInput"
          - $ref: "#/components/messages/StreamClose"
          - $ref: "#/components/messages/ClientOperationResult"
          - $ref: "#/components/messages/PreviewTunnelOpen"
          - $ref: "#/components/messages/PreviewHttpRequest"
          - $ref: "#/components/messages/PreviewHttpCancel"
          - $ref: "#/components/messages/PreviewTunnelClose"
          - $ref: "#/components/messages/ViewEvent"
          - $ref: "#/components/messages/ViewPatchAcknowledge"
          - $ref: "#/components/messages/ViewSnapshotRequest"
          - $ref: "#/components/messages/ViewClose"
          - $ref: "#/components/messages/Pong"
      serverFrame:
        oneOf:
          - $ref: "#/components/messages/Subscribed"
          - $ref: "#/components/messages/Event"
          - $ref: "#/components/messages/ResyncRequired"
          - $ref: "#/components/messages/StreamOpened"
          - $ref: "#/components/messages/StreamData"
          - $ref: "#/components/messages/StreamClosed"
          - $ref: "#/components/messages/FlowPaused"
          - $ref: "#/components/messages/ClientOperationRequest"
          - $ref: "#/components/messages/ClientOperationCancel"
          - $ref: "#/components/messages/PreviewTunnelOpened"
          - $ref: "#/components/messages/PreviewHttpResponse"
          - $ref: "#/components/messages/PreviewTunnelClosed"
          - $ref: "#/components/messages/ViewPatch"
          - $ref: "#/components/messages/ViewSnapshot"
          - $ref: "#/components/messages/ViewClosed"
          - $ref: "#/components/messages/ViewFocus"
          - $ref: "#/components/messages/ViewAnnouncement"
          - $ref: "#/components/messages/Ping"
          - $ref: "#/components/messages/SocketError"
operations:
  receiveClientFrames:
    action: receive
    channel:
      $ref: "#/channels/nodeSocket"
    messages:
      - $ref: "#/channels/nodeSocket/messages/clientFrame"
    security:
      - $ref: "#/components/securitySchemes/websocketTicket"
  sendServerFrames:
    action: send
    channel:
      $ref: "#/channels/nodeSocket"
    messages:
      - $ref: "#/channels/nodeSocket/messages/serverFrame"
    security:
      - $ref: "#/components/securitySchemes/websocketTicket"
components:
  securitySchemes:
    deviceMtls:
      type: X509
      description: TLS 1.3 client certificate for the current non-revoked paired device generation.
    websocketTicket:
      type: httpApiKey
      name: Sec-WebSocket-Protocol
      in: header
      description: >-
        One-use, 15-minute maximum acorn.v2.ticket.<base64url> value bound to the
        device certificate, TLS exporter, Node, session revision and protocol.
        It is consumed during upgrade and is never a bearer credential.
  messages:
    Subscribe:
      name: subscribe
      payload:
        $ref: "#/components/schemas/SubscribeFrame"
    Unsubscribe:
      name: unsubscribe
      payload:
        type: object
        additionalProperties: false
        required: [type, subscriptionId]
        properties:
          type: { const: unsubscribe }
          subscriptionId: { $ref: "#/components/schemas/UuidV7" }
    Acknowledge:
      name: acknowledge
      payload:
        type: object
        additionalProperties: false
        required: [type, subscriptionId, through]
        properties:
          type: { const: acknowledge }
          subscriptionId: { $ref: "#/components/schemas/UuidV7" }
          through: { $ref: "#/components/schemas/Decimal" }
    StreamOpen:
      name: streamOpen
      payload:
        type: object
        additionalProperties: false
        required: [type, stream, afterOffset]
        properties:
          type: { const: stream.open }
          stream: { $ref: "#/components/schemas/AcornUri" }
          afterOffset: { $ref: "#/components/schemas/Decimal" }
    StreamCredit:
      name: streamCredit
      payload:
        type: object
        additionalProperties: false
        required: [type, stream, bytes]
        properties:
          type: { const: stream.credit }
          stream: { $ref: "#/components/schemas/AcornUri" }
          bytes: { type: integer, minimum: 1, maximum: 1048576 }
    StreamInput:
      name: streamInput
      payload:
        type: object
        additionalProperties: false
        required: [type, stream, sequence, encoding, content]
        properties:
          type: { const: stream.input }
          stream: { $ref: "#/components/schemas/AcornUri" }
          sequence: { $ref: "#/components/schemas/Decimal" }
          encoding: { enum: [utf8, base64] }
          content: { type: string, maxLength: 87384 }
    StreamClose:
      name: streamClose
      payload:
        type: object
        additionalProperties: false
        required: [type, stream]
        properties:
          type: { const: stream.close }
          stream: { $ref: "#/components/schemas/AcornUri" }
    Pong:
      name: pong
      payload:
        type: object
        additionalProperties: false
        required: [type, nonce]
        properties:
          type: { const: pong }
          nonce: { type: string, pattern: "^[A-Za-z0-9_-]{22}$" }
    ClientOperationResult:
      name: clientOperationResult
      payload:
        oneOf:
          - type: object
            additionalProperties: false
            required: [type, requestId, status, output, error]
            properties:
              type: { const: client.operation.result }
              requestId: { $ref: "#/components/schemas/UuidV7" }
              status: { const: success }
              output: { type: object, maxProperties: 64 }
              error: { type: "null" }
          - type: object
            additionalProperties: false
            required: [type, requestId, status, output, error]
            properties:
              type: { const: client.operation.result }
              requestId: { $ref: "#/components/schemas/UuidV7" }
              status: { enum: [error, cancelled, expired] }
              output: { type: "null" }
              error:
                type: object
                additionalProperties: false
                required: [code, retryable, detail]
                properties:
                  code: { type: string, pattern: "^[a-z][a-z0-9_]{1,99}$" }
                  retryable: { type: boolean }
                  detail: { type: string, minLength: 1, maxLength: 300 }
    PreviewTunnelOpen:
      name: previewTunnelOpen
      payload:
        type: object
        additionalProperties: false
        required:
          [type, tunnelId, viewSession, viewCapability, task, targetId, targetGeneration,
           clientOriginGeneration, listenerTokenDigest, requestedExpiresAt]
        properties:
          type: { const: preview.tunnel.open }
          tunnelId: { $ref: "#/components/schemas/UuidV7" }
          viewSession: { $ref: "#/components/schemas/AcornUri" }
          viewCapability: { $ref: "#/components/schemas/ViewCapability" }
          task: { $ref: "#/components/schemas/AcornUri" }
          targetId: { type: string, pattern: "^[a-z][a-z0-9-]{0,62}$" }
          targetGeneration: { $ref: "#/components/schemas/Decimal" }
          clientOriginGeneration: { $ref: "#/components/schemas/UuidV7" }
          listenerTokenDigest: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
          requestedExpiresAt: { $ref: "#/components/schemas/Timestamp" }
    PreviewHttpRequest:
      name: previewHttpRequest
      payload:
        type: object
        additionalProperties: false
        required: [type, tunnel, requestId, sequence, targetGeneration, method, path, headers, body]
        properties:
          type: { const: preview.http.request }
          tunnel: { $ref: "#/components/schemas/AcornUri" }
          requestId: { $ref: "#/components/schemas/UuidV7" }
          sequence: { $ref: "#/components/schemas/Decimal" }
          targetGeneration: { $ref: "#/components/schemas/Decimal" }
          method: { enum: [GET, HEAD, POST, PUT, PATCH, DELETE, OPTIONS] }
          path:
            type: string
            pattern: "^/(?!/)[^\\u0000\\r\\n]{0,8191}$"
          headers: { $ref: "#/components/schemas/PreviewHeaders" }
          body: { $ref: "#/components/schemas/PreviewBody" }
    PreviewHttpCancel:
      name: previewHttpCancel
      payload:
        type: object
        additionalProperties: false
        required: [type, tunnel, requestId, reason]
        properties:
          type: { const: preview.http.cancel }
          tunnel: { $ref: "#/components/schemas/AcornUri" }
          requestId: { $ref: "#/components/schemas/UuidV7" }
          reason: { enum: [browser_cancelled, navigation_changed, view_closed, deadline] }
    PreviewTunnelClose:
      name: previewTunnelClose
      payload:
        type: object
        additionalProperties: false
        required: [type, tunnel, lastRequestSequence, reason]
        properties:
          type: { const: preview.tunnel.close }
          tunnel: { $ref: "#/components/schemas/AcornUri" }
          lastRequestSequence: { $ref: "#/components/schemas/Decimal" }
          reason: { enum: [view_closed, navigation, client_shutdown, user] }
    ViewEvent:
      name: viewEvent
      payload:
        type: object
        additionalProperties: false
        required: [type, session, capability, eventId, documentRevision, kind, target, payload]
        properties:
          type: { const: view.event }
          session: { $ref: "#/components/schemas/AcornUri" }
          capability: { $ref: "#/components/schemas/ViewCapability" }
          eventId: { $ref: "#/components/schemas/UuidV7" }
          documentRevision: { $ref: "#/components/schemas/Decimal" }
          kind:
            enum:
              - action-invoke
              - binding-edit
              - binding-commit
              - binding-reset
              - selection-change
              - page-request
              - sort-filter-change
              - disclosure-change
              - focus-change
              - visibility-change
          target: { type: string, pattern: "^[A-Za-z][A-Za-z0-9_.-]{0,127}$" }
          payload: { type: object, maxProperties: 64 }
    ViewPatchAcknowledge:
      name: viewPatchAcknowledge
      payload:
        type: object
        additionalProperties: false
        required: [type, session, capability, throughRevision]
        properties:
          type: { const: view.patch.ack }
          session: { $ref: "#/components/schemas/AcornUri" }
          capability: { $ref: "#/components/schemas/ViewCapability" }
          throughRevision: { $ref: "#/components/schemas/Decimal" }
    ViewSnapshotRequest:
      name: viewSnapshotRequest
      payload:
        type: object
        additionalProperties: false
        required: [type, session, capability, lastRevision, reason]
        properties:
          type: { const: view.snapshot.request }
          session: { $ref: "#/components/schemas/AcornUri" }
          capability: { $ref: "#/components/schemas/ViewCapability" }
          lastRevision: { $ref: "#/components/schemas/Decimal" }
          reason: { enum: [initial, revision_gap, invalid_patch, reconnect, capability_change] }
    ViewClose:
      name: viewClose
      payload:
        type: object
        additionalProperties: false
        required: [type, session, capability, reason]
        properties:
          type: { const: view.close }
          session: { $ref: "#/components/schemas/AcornUri" }
          capability: { $ref: "#/components/schemas/ViewCapability" }
          reason: { enum: [user, surface_closed, navigation, client_shutdown] }
    Subscribed:
      name: subscribed
      payload:
        type: object
        additionalProperties: false
        required:
          [type, subscriptionId, channel, eventTypes, resourcePrefixes, after,
           oldestSequence, currentSequence]
        properties:
          type: { const: subscribed }
          subscriptionId: { $ref: "#/components/schemas/UuidV7" }
          channel: { type: string, pattern: "^[a-z][a-z0-9.-]{0,99}$" }
          eventTypes:
            type: array
            maxItems: 64
            uniqueItems: true
            items:
              type: string
              pattern: "^[a-z][a-z0-9-]*(?:[.-][a-z0-9-]+)+\\.v[1-9][0-9]*$"
          resourcePrefixes:
            type: array
            maxItems: 64
            uniqueItems: true
            items: { $ref: "#/components/schemas/AcornUri" }
          after: { $ref: "#/components/schemas/Decimal" }
          oldestSequence: { $ref: "#/components/schemas/Decimal" }
          currentSequence: { $ref: "#/components/schemas/Decimal" }
    Event:
      name: event
      payload:
        type: object
        additionalProperties: false
        required: [type, subscriptionId, event]
        properties:
          type: { const: event }
          subscriptionId: { $ref: "#/components/schemas/UuidV7" }
          event:
            $ref: ../schema/event-envelope-v2.schema.json
    ResyncRequired:
      name: resyncRequired
      payload:
        type: object
        additionalProperties: false
        required: [type, subscriptionId, oldestSequence, currentSequence]
        properties:
          type: { const: resync_required }
          subscriptionId: { $ref: "#/components/schemas/UuidV7" }
          oldestSequence: { $ref: "#/components/schemas/Decimal" }
          currentSequence: { $ref: "#/components/schemas/Decimal" }
    StreamOpened:
      name: streamOpened
      payload:
        type: object
        additionalProperties: false
        required: [type, stream, mediaType, oldestOffset, currentOffset]
        properties:
          type: { const: stream.opened }
          stream: { $ref: "#/components/schemas/AcornUri" }
          mediaType: { type: string, minLength: 1, maxLength: 160 }
          oldestOffset: { $ref: "#/components/schemas/Decimal" }
          currentOffset: { $ref: "#/components/schemas/Decimal" }
    StreamData:
      name: streamData
      payload:
        type: object
        additionalProperties: false
        required: [type, stream, offset, encoding, content, digest]
        properties:
          type: { const: stream.data }
          stream: { $ref: "#/components/schemas/AcornUri" }
          offset: { $ref: "#/components/schemas/Decimal" }
          encoding: { enum: [utf8, base64] }
          content: { type: string, maxLength: 87384 }
          digest: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
    StreamClosed:
      name: streamClosed
      payload:
        type: object
        additionalProperties: false
        required: [type, stream, reason, finalOffset]
        properties:
          type: { const: stream.closed }
          stream: { $ref: "#/components/schemas/AcornUri" }
          reason: { enum: [eof, detached, terminated, expired, unauthorized, error] }
          finalOffset: { $ref: "#/components/schemas/Decimal" }
    FlowPaused:
      name: flowPaused
      payload:
        type: object
        additionalProperties: false
        required: [type, queuedBytes, closeAfterMs]
        properties:
          type: { const: flow.paused }
          queuedBytes: { type: integer, minimum: 0, maximum: 8388608 }
          closeAfterMs: { const: 30000 }
    ClientOperationRequest:
      name: clientOperationRequest
      payload:
        type: object
        additionalProperties: false
        required: [type, requestId, viewSession, operation, deadline, input]
        properties:
          type: { const: client.operation.request }
          requestId: { $ref: "#/components/schemas/UuidV7" }
          viewSession: { $ref: "#/components/schemas/AcornUri" }
          operation:
            type: string
            pattern: "^[a-z][a-z0-9-]*(?:[.-][a-z0-9-]+)+\\.v[1-9][0-9]*$"
            maxLength: 200
          deadline: { $ref: "#/components/schemas/Timestamp" }
          input: { type: object, maxProperties: 64 }
    ClientOperationCancel:
      name: clientOperationCancel
      payload:
        type: object
        additionalProperties: false
        required: [type, requestId, reason]
        properties:
          type: { const: client.operation.cancel }
          requestId: { $ref: "#/components/schemas/UuidV7" }
          reason: { enum: [caller_cancelled, capability_revoked, view_closed, deadline, node_shutdown] }
    PreviewTunnelOpened:
      name: previewTunnelOpened
      payload:
        type: object
        additionalProperties: false
        required:
          [type, tunnelId, tunnel, deviceId, viewSession, targetGeneration, targetOrigin,
           clientOriginGeneration, expiresAt, limits]
        properties:
          type: { const: preview.tunnel.opened }
          tunnelId: { $ref: "#/components/schemas/UuidV7" }
          tunnel: { $ref: "#/components/schemas/AcornUri" }
          deviceId: { $ref: "#/components/schemas/UuidV7" }
          viewSession: { $ref: "#/components/schemas/AcornUri" }
          targetGeneration: { $ref: "#/components/schemas/Decimal" }
          targetOrigin:
            type: string
            format: uri
            pattern: "^https?://[^/?#]+$"
            maxLength: 500
          clientOriginGeneration: { $ref: "#/components/schemas/UuidV7" }
          expiresAt: { $ref: "#/components/schemas/Timestamp" }
          limits:
            type: object
            additionalProperties: false
            required: [maxConcurrentRequests, maxRequestBytes, maxResponseBytes, maxTunnelBytes, requestTimeoutMs]
            properties:
              maxConcurrentRequests: { type: integer, minimum: 1, maximum: 32 }
              maxRequestBytes: { type: integer, minimum: 0, maximum: 16777216 }
              maxResponseBytes: { type: integer, minimum: 0, maximum: 16777216 }
              maxTunnelBytes: { type: integer, minimum: 1, maximum: 67108864 }
              requestTimeoutMs: { type: integer, minimum: 100, maximum: 60000 }
    PreviewHttpResponse:
      name: previewHttpResponse
      payload:
        oneOf:
          - type: object
            additionalProperties: false
            required:
              [type, tunnel, requestId, requestSequence, targetGeneration, status, headers,
               body, finalPath, error]
            properties:
              type: { const: preview.http.response }
              tunnel: { $ref: "#/components/schemas/AcornUri" }
              requestId: { $ref: "#/components/schemas/UuidV7" }
              requestSequence: { $ref: "#/components/schemas/Decimal" }
              targetGeneration: { $ref: "#/components/schemas/Decimal" }
              status: { type: integer, minimum: 100, maximum: 599 }
              headers: { $ref: "#/components/schemas/PreviewHeaders" }
              body: { $ref: "#/components/schemas/PreviewBody" }
              finalPath: { type: string, pattern: "^/(?!/)[^\\u0000\\r\\n]{0,8191}$" }
              error: { type: "null" }
          - type: object
            additionalProperties: false
            required:
              [type, tunnel, requestId, requestSequence, targetGeneration, status, headers,
               body, finalPath, error]
            properties:
              type: { const: preview.http.response }
              tunnel: { $ref: "#/components/schemas/AcornUri" }
              requestId: { $ref: "#/components/schemas/UuidV7" }
              requestSequence: { $ref: "#/components/schemas/Decimal" }
              targetGeneration: { $ref: "#/components/schemas/Decimal" }
              status: { type: "null" }
              headers: { type: array, maxItems: 0 }
              body:
                type: object
                additionalProperties: false
                required: [kind]
                properties:
                  kind: { const: none }
              finalPath: { type: "null" }
              error:
                type: object
                additionalProperties: false
                required: [code, retryable, detail]
                properties:
                  code:
                    enum:
                      [target_unavailable, navigation_denied, target_changed, request_too_large,
                       response_too_large, deadline, cancelled, tunnel_revoked, protocol_error]
                  retryable: { type: boolean }
                  detail: { type: string, minLength: 1, maxLength: 300 }
    PreviewTunnelClosed:
      name: previewTunnelClosed
      payload:
        type: object
        additionalProperties: false
        required: [type, tunnel, finalRequestSequence, transferredBytes, reason]
        properties:
          type: { const: preview.tunnel.closed }
          tunnel: { $ref: "#/components/schemas/AcornUri" }
          finalRequestSequence: { $ref: "#/components/schemas/Decimal" }
          transferredBytes: { type: integer, minimum: 0, maximum: 67108864 }
          reason:
            enum:
              [client_closed, view_closed, expired, target_changed, device_revoked,
               plugin_disabled, grant_revoked, task_archived, disconnected, quota, error]
    ViewPatch:
      name: viewPatch
      payload:
        type: object
        additionalProperties: false
        required: [type, session, patch]
        properties:
          type: { const: view.patch }
          session: { $ref: "#/components/schemas/AcornUri" }
          patch: { $ref: ../schema/ui-patch-v2.schema.json }
    ViewSnapshot:
      name: viewSnapshot
      payload:
        type: object
        additionalProperties: false
        required: [type, reason, session, document]
        properties:
          type: { const: view.snapshot }
          reason: { enum: [opened, requested, resumed, capability_changed] }
          session: { $ref: ../schema/view-session-v2.schema.json }
          document: { $ref: ../schema/ui-document-v2.schema.json }
    ViewClosed:
      name: viewClosed
      payload:
        type: object
        additionalProperties: false
        required: [type, session, reason, recoverable]
        properties:
          type: { const: view.closed }
          session: { $ref: "#/components/schemas/AcornUri" }
          reason:
            enum:
              - user
              - expired
              - capability_revoked
              - plugin_disabled
              - plugin_updated
              - context_changed
              - node_shutdown
              - protocol_error
          recoverable: { type: boolean }
    ViewFocus:
      name: viewFocus
      payload:
        type: object
        additionalProperties: false
        required: [type, session, target, documentRevision]
        properties:
          type: { const: view.focus }
          session: { $ref: "#/components/schemas/AcornUri" }
          target: { type: string, pattern: "^[A-Za-z][A-Za-z0-9_-]{0,63}$" }
          documentRevision: { $ref: "#/components/schemas/Decimal" }
    ViewAnnouncement:
      name: viewAnnouncement
      payload:
        type: object
        additionalProperties: false
        required: [type, session, messageKey, defaultMessage, parameters, politeness]
        properties:
          type: { const: view.announcement }
          session: { $ref: "#/components/schemas/AcornUri" }
          messageKey: { type: string, pattern: "^[a-z][a-z0-9.-]{0,127}$" }
          defaultMessage: { type: string, minLength: 1, maxLength: 300 }
          parameters: { type: object, maxProperties: 16 }
          politeness: { enum: [polite, assertive] }
    Ping:
      name: ping
      payload:
        type: object
        additionalProperties: false
        required: [type, nonce]
        properties:
          type: { const: ping }
          nonce: { type: string, pattern: "^[A-Za-z0-9_-]{22}$" }
    SocketError:
      name: socketError
      payload:
        type: object
        additionalProperties: false
        required: [type, code, retryable, detail]
        properties:
          type: { const: error }
          code: { type: string, pattern: "^[a-z][a-z0-9_]{1,99}$" }
          retryable: { type: boolean }
          detail: { type: string, minLength: 1, maxLength: 300 }
  schemas:
    UuidV7:
      type: string
      pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
    Decimal:
      type: string
      pattern: "^(0|[1-9][0-9]*)$"
    AcornUri:
      type: string
      pattern: "^acorn://[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}/[a-z][a-z0-9.-]*/[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
    Timestamp:
      type: string
      format: date-time
      pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\\.[0-9]{3}Z$"
    ViewCapability:
      type: string
      pattern: "^[A-Za-z0-9_-]{43}$"
      writeOnly: true
    PreviewHeaders:
      type: array
      maxItems: 64
      items:
        type: object
        additionalProperties: false
        required: [name, value]
        properties:
          name:
            type: string
            pattern: "^[a-z][a-z0-9-]{0,62}$"
          value:
            type: string
            maxLength: 8192
            pattern: "^[^\\u0000\\r\\n]*$"
    PreviewBody:
      oneOf:
        - type: object
          additionalProperties: false
          required: [kind]
          properties:
            kind: { const: none }
        - type: object
          additionalProperties: false
          required: [kind, encoding, content, decodedBytes, digest]
          properties:
            kind: { const: inline }
            encoding: { const: base64 }
            content: { type: string, maxLength: 349528 }
            decodedBytes: { type: integer, minimum: 0, maximum: 262144 }
            digest: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
        - type: object
          additionalProperties: false
          required: [kind, stream, decodedBytes, digest]
          properties:
            kind: { const: stream }
            stream: { $ref: "#/components/schemas/AcornUri" }
            decodedBytes: { type: integer, minimum: 1, maximum: 16777216 }
            digest: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
    SubscribeFrame:
      type: object
      additionalProperties: false
      required: [type, subscriptionId, channel, eventTypes, resourcePrefixes, after]
      properties:
        type: { const: subscribe }
